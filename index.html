    <!-- Inline script to prevent theme flash & ensure instant theme initialization -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('arth_theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
